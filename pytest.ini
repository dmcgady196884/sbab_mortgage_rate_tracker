[pytest]
testpaths = tests
# Live-API tests (hit SBAB, open real PRs) only run when selected explicitly, e.g. -m slow or -m ""
addopts = -m "not slow and not very_slow"
markers =
    slow: light-run tests hitting real SBAB API (~2 min locally, ~5 min CI)
    very_slow: deep-run tests hitting real SBAB API (~13 min locally, ~50 min CI)
